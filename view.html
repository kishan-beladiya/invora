<!DOCTYPE html>
<!--
  Invora — hosted invoice viewer.
  Host this file on your domain so shared links render the invoice INLINE
  (works on Android, where Chrome otherwise just downloads PDFs) with Print +
  Download buttons and branding.

  The shared link is:  https://<your-domain>/view.html?token=<token>
  (SupabaseConfig.invoiceLink builds it; update viewerBaseUrl there if the
  domain changes, and FUNCTIONS_BASE below if the Supabase project changes.)
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5">
  <title>Invoice · Invora</title>
  <style>
    :root { --navy:#112844; --cream:#F4EFE4; --gold:#D7A837; }
    * { box-sizing:border-box; }
    html,body { margin:0; min-height:100%; background:#e9edf1;
      font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
      color:var(--navy); }
    header { position:sticky; top:0; z-index:10; display:flex; align-items:center;
      justify-content:space-between; gap:10px; padding:12px 14px; background:var(--navy);
      color:var(--cream); box-shadow:0 1px 8px rgba(0,0,0,.18); }
    .brand { display:flex; align-items:center; gap:9px; font-weight:800; font-size:18px;
      letter-spacing:-.3px; }
    .dot { width:22px; height:22px; border-radius:6px; background:var(--cream); display:inline-block; }
    .actions { display:flex; align-items:center; gap:8px; }
    .btn { text-decoration:none; font-weight:700; font-size:14px; padding:9px 15px;
      border-radius:10px; white-space:nowrap; cursor:pointer; }
    .btn:active { transform:translateY(1px); }
    .dl { background:var(--gold); color:#3a2c05; border:0; }
    .ghost { background:transparent; color:var(--cream); border:1.5px solid rgba(244,239,228,.5); }
    main { max-width:840px; margin:0 auto; padding:16px 10px 40px; }
    canvas { display:block; width:100%; max-width:820px; height:auto; margin:0 auto 14px;
      background:#fff; border-radius:6px; box-shadow:0 2px 12px rgba(17,40,68,.14); }
    #status { text-align:center; padding:64px 20px; color:#5b6b7b; font-size:15px; }
    .spinner { width:34px; height:34px; border:3px solid #cfd8e3; border-top-color:var(--navy);
      border-radius:50%; animation:spin 1s linear infinite; margin:0 auto 16px; }
    @keyframes spin { to { transform:rotate(360deg); } }
    .err { max-width:340px; margin:0 auto; }
    .err svg { margin-bottom:14px; }
    .err-t { font-size:18px; font-weight:700; color:var(--navy); margin-bottom:6px; }
    .err-m { font-size:14px; line-height:21px; color:#5b6b7b; }
    footer { text-align:center; color:#8a97a5; font-size:12px; padding:6px 0 28px; }
    @media print {
      header, footer { display:none !important; }
      html, body { background:#fff; }
      main { max-width:none; padding:0; }
      canvas { box-shadow:none; border-radius:0; margin:0 auto; max-width:100%;
        page-break-after:always; }
    }
  </style>
</head>
<body>
  <header>
    <span class="brand"><span class="dot"></span>Invora</span>
    <span class="actions">
      <a id="print" class="btn ghost" style="display:none" href="#">Print</a>
      <a id="download" class="btn dl" style="display:none" href="#" rel="noopener">Download</a>
    </span>
  </header>
  <main>
    <div id="status"><div class="spinner"></div>Loading invoice…</div>
    <div id="pages"></div>
  </main>
  <footer>Sent with Invora · Invoices made effortless</footer>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script>
    // Update this if the Supabase project ref changes.
    const FUNCTIONS_BASE = 'https://ojerckbyvevgaihlhwab.functions.supabase.co';

    const statusEl = document.getElementById('status');
    const pagesEl = document.getElementById('pages');
    const dlEl = document.getElementById('download');
    const printEl = document.getElementById('print');

    const DOC_ICON = '<svg width="46" height="46" viewBox="0 0 24 24" fill="none" '
      + 'stroke="#98a4b2" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">'
      + '<path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/>'
      + '<path d="M14 3v5h5"/><path d="M9.5 13l5 5M14.5 13l-5 5"/></svg>';

    // kind: 'invalid' | 'unavailable' | 'load'
    function fail(kind) {
      dlEl.style.display = 'none';
      printEl.style.display = 'none';
      let title, msg;
      if (kind === 'invalid') {
        title = 'Invalid link';
        msg = "This invoice link doesn't look right. Please check the URL, or ask the sender to share it again.";
      } else if (kind === 'load') {
        title = "Couldn't load this invoice";
        msg = 'The link may have expired. Please ask the sender for a new one.';
      } else {
        title = 'Invoice not available';
        msg = 'This link may have expired or been revoked. Please ask the sender to share it again.';
      }
      statusEl.style.display = '';
      statusEl.innerHTML = '<div class="err">' + DOC_ICON +
        '<div class="err-t">' + title + '</div>' +
        '<div class="err-m">' + msg + '</div></div>';
    }

    printEl.addEventListener('click', function (e) { e.preventDefault(); window.print(); });

    const token = new URLSearchParams(location.search).get('token');
    if (!token) {
      fail('invalid');
    } else {
      pdfjsLib.GlobalWorkerOptions.workerSrc =
        'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
      fetch(FUNCTIONS_BASE + '/view-invoice?format=json&token=' + encodeURIComponent(token))
        .then(function (r) { return r.ok ? r.json() : Promise.reject(r.status); })
        .then(function (data) {
          if (!data || !data.url) return fail('unavailable');
          dlEl.href = data.downloadUrl || data.url;
          dlEl.style.display = '';
          return renderPdf(data.url);
        })
        .catch(function () { fail('unavailable'); });
    }

    async function renderPdf(url) {
      try {
        const pdf = await pdfjsLib.getDocument(url).promise;
        statusEl.style.display = 'none';
        printEl.style.display = '';
        const RENDER_W = 1400; // render resolution; CSS scales down responsively
        for (let n = 1; n <= pdf.numPages; n++) {
          const page = await pdf.getPage(n);
          const base = page.getViewport({ scale: 1 });
          const vp = page.getViewport({ scale: RENDER_W / base.width });
          const canvas = document.createElement('canvas');
          canvas.width = vp.width;
          canvas.height = vp.height;
          pagesEl.appendChild(canvas);
          await page.render({ canvasContext: canvas.getContext('2d'), viewport: vp }).promise;
        }
      } catch (e) {
        fail('load');
      }
    }
  </script>
</body>
</html>
